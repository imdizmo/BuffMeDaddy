<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="256" height="256" viewBox="0 0 256 256">
<!-- BuffMeDaddy icon: a mead flask in AdminHammer's frame. Render: rsvg-convert -w 256 -h 256 tools/icon.svg -o package/icon.png -->
<defs>
    <radialGradient id="tileFill" cx="50%" cy="45%" r="70%">
      <stop offset="0" stop-color="#2e231a"/><stop offset="1" stop-color="#17120e"/>
    </radialGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#e6be6e" stop-opacity=".38"/><stop offset="1" stop-color="#e6be6e" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fbe5a6"/><stop offset=".5" stop-color="#e3b456"/><stop offset="1" stop-color="#a8742a"/>
    </linearGradient>
    <linearGradient id="mead" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f7cf62"/><stop offset="1" stop-color="#bf6418"/>
    </linearGradient>
    <linearGradient id="wood" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#a97445"/><stop offset="1" stop-color="#7a5030"/>
    </linearGradient>
    <clipPath id="bulbClip"><circle cx="128" cy="156" r="58"/></clipPath>

    <symbol id="tile" viewBox="0 0 256 256">
      <rect x="8" y="8" width="240" height="240" rx="36" fill="url(#tileFill)" stroke="#c9a056" stroke-width="6"/>
      <rect x="20" y="20" width="216" height="216" rx="28" fill="none" stroke="#d6b26e" stroke-opacity=".3" stroke-width="2"/>
      <circle cx="128" cy="128" r="96" fill="url(#glow)"/>
    </symbol>

    <symbol id="sparkle" viewBox="-20 -20 40 40">
      <path d="M0 -18 Q0 0 18 0 Q0 0 0 18 Q0 0 -18 0 Q0 0 0 -18 Z" fill="#fff6da"/>
    </symbol>
    <symbol id="flask" viewBox="0 0 256 256">
      <g stroke="#22170e" stroke-width="6" stroke-linejoin="round">
        <rect x="108" y="70" width="40" height="44" rx="6" fill="#3b2c22"/>
        <circle cx="128" cy="156" r="64" fill="#3b2c22"/>
      </g>
      <g clip-path="url(#bulbClip)">
        <rect x="60" y="138" width="140" height="90" fill="url(#mead)"/>
        <ellipse cx="128" cy="138" rx="60" ry="8" fill="#fbe08a"/>
        <circle cx="110" cy="178" r="4.5" fill="#fff1c2" opacity=".85"/>
        <circle cx="142" cy="192" r="3.5" fill="#fff1c2" opacity=".8"/>
        <circle cx="152" cy="164" r="3" fill="#fff1c2" opacity=".8"/>
      </g>
      <g stroke="#22170e" stroke-width="6" stroke-linejoin="round">
        <circle cx="128" cy="156" r="64" fill="none"/>
        <rect x="104" y="96" width="48" height="11" rx="5.5" fill="url(#wood)"/>
        <rect x="100" y="62" width="56" height="14" rx="7" fill="url(#gold)"/>
        <rect x="112" y="36" width="32" height="30" rx="6" fill="url(#wood)"/>
      </g>
      <path d="M84 146 A46 46 0 0 1 104 116" fill="none" stroke="#fff" stroke-opacity=".55" stroke-width="7" stroke-linecap="round"/>
    </symbol>
    <symbol id="iconA" viewBox="0 0 256 256">
      <use href="#tile"/>
      <use href="#flask" x="0" y="4" width="256" height="256"/>
      <use href="#sparkle" x="168" y="46" width="44" height="44"/>
      <use href="#sparkle" x="56" y="78" width="22" height="22"/>
    </symbol>
</defs>
<use href="#iconA" width="256" height="256"/>
</svg>
